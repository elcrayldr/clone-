name: Windows VST3 Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore JUCE and CMake build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-vs2022-juce806-${{ hashFiles('CMakeLists.txt', 'Source/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-vs2022-juce806-

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel 2

      - name: Run automated tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRAY-LDR-DRUMKIT-CLONE-Windows-VST3
          path: build/**/Release/VST3/**
          if-no-files-found: error
