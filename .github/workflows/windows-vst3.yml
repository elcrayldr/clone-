name: DRUM LAB V1 Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: drum-lab-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore JUCE and CMake cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-drumlab-juce806-${{ hashFiles('CMakeLists.txt', '*.cpp', '*.h') }}
          restore-keys: |
            ${{ runner.os }}-drumlab-juce806-

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel 2

      - name: Verify VST3 bundle structure
        shell: pwsh
        run: |
          $plugin = Join-Path (Get-Location) "build/CrayLdrDrumLabV1_artefacts/Release/VST3/CRAY LDR DRUM LAB V1.vst3"
          $moduleInfo = Join-Path $plugin "Contents/Resources/moduleinfo.json"
          $binaryDir = Join-Path $plugin "Contents/x86_64-win"
          if (-not (Test-Path -LiteralPath $moduleInfo -PathType Leaf)) { throw "VST3 moduleinfo.json missing." }
          if (-not (Test-Path -LiteralPath $binaryDir -PathType Container)) { throw "VST3 x64 binary directory missing." }
          $binary = Get-ChildItem -LiteralPath $binaryDir -Filter "*.vst3" -File | Select-Object -First 1
          if ($null -eq $binary -or $binary.Length -lt 65536) { throw "VST3 x64 binary missing or implausibly small." }
          $metadata = Get-Content -LiteralPath $moduleInfo -Raw
          if ($metadata -notmatch [regex]::Escape("CRAY LDR DRUM LAB V1")) { throw "VST3 metadata does not match DRUM LAB V1." }

      - name: Validate VST3 lifecycle and state with pluginval
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "pluginval_Windows.zip"
          $dest = Join-Path $env:RUNNER_TEMP "pluginval"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $validator = Get-ChildItem -Path $dest -Filter "pluginval.exe" -Recurse | Select-Object -First 1
          if ($null -eq $validator) { throw "pluginval.exe not found." }
          $plugin = Join-Path (Get-Location) "build/CrayLdrDrumLabV1_artefacts/Release/VST3/CRAY LDR DRUM LAB V1.vst3"
          $logDir = Join-Path $env:RUNNER_TEMP "pluginval-logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          & $validator.FullName --strictness-level 10 --output-dir $logDir $plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drum-lab-v1-pluginval-logs
          path: ${{ runner.temp }}/pluginval-logs/
          if-no-files-found: ignore

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRAY-LDR-DRUM-LAB-V1-Windows-VST3
          path: build/CrayLdrDrumLabV1_artefacts/Release/VST3/
          if-no-files-found: error
